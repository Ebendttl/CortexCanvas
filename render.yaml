services:
  - type: web
    name: cortex-canvas
    env: docker
    plan: free
    branch: main
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://cortex-canvas.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: true
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: true
